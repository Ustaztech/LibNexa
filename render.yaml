services:
  - type: web
    name: libnexa-nsuk-web
    runtime: static
    buildCommand: cd apps/web && npm ci --workspaces=false && npm run build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://libnexa-nsuk-api.onrender.com/api/v1

  - type: web
    name: libnexa-nsuk-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix packages/shared run build && npm --prefix apps/api run prisma:generate:render && npm --prefix apps/api run build
    startCommand: npm --prefix apps/api run start:render
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        value: https://libnexa-nsuk-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: libnexa-nsuk-db
          property: connectionString

databases:
  - name: libnexa-nsuk-db
    databaseName: libnexa
    user: libnexa
    region: frankfurt
    plan: free
